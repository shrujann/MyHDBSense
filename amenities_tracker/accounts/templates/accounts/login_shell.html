{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>MyHDBSense | Sign In</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body>

  {# Include navbar so the modal markup exists #}
  {% include "accounts/navbar.html" %}

  <main class="container py-5">
    <div class="text-center text-muted">
      <div class="spinner-border mb-3" role="status" aria-hidden="true"></div>
      <p>Opening sign-in…</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1) Force open the auth modal
      const modalEl = document.getElementById('authModal');
      if (modalEl) {
        const m = new bootstrap.Modal(modalEl);
        m.show();
      }

      // 2) Ensure the login form's hidden "next" points to the original target
      const nextFromServer = "{{ next_url|escapejs }}";
      const nextInput = document.querySelector('#loginForm input[name="next"]');
      if (nextInput && nextFromServer) nextInput.value = nextFromServer;

      // 3) Make sure we're on the login pane (not register/reset)
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      const resetForm = document.getElementById('resetForm');
      [loginForm, registerForm, resetForm].forEach(f => f && f.classList.add('d-none'));
      if (loginForm) loginForm.classList.remove('d-none');

      // 4) Update modal header text (optional)
      const title = document.getElementById('authTitle');
      const subtitle = document.getElementById('authSubtitle');
      if (title) title.textContent = "Welcome Back";
      if (subtitle) subtitle.textContent = "Sign in to access MyHDBSense";
    });
  </script>
</body>
</html>
