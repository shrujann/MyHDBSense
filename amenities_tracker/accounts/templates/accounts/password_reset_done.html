{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>MyHDBSense | Reset Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'assets/style.css' %}">
</head>
<body class="bg-light">
    {% include "accounts/navbar.html" %}
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h2 class="h5 mb-3 text-center fw-bold">Check Your Email</h2>
                        <p class="text-muted small text-center mb-4">
                            We've emailed you instructions for setting your password. 
                            If you don't receive an email, please make sure you've entered 
                            the address you registered with.
                        </p>
                        <div class="text-center">
                            <a href="{% url 'login' %}" class="small text-decoration-none">Back to Sign In</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
