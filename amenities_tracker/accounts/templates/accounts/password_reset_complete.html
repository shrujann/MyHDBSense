{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>MyHDBSense | Password Reset Complete</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'assets/style.css' %}">

  <style>
    :root { --brand:#2563eb; }
    body { background:#f6f7fb; }
    .nav-link { font-weight:500; color:#333; }
    .nav-link.active, .nav-link:hover { color:var(--brand); }

    .done-wrap { max-width:540px; }
    .done-card { border:0; border-radius:1rem; box-shadow:0 18px 40px rgba(16,24,40,.10); overflow:hidden; }
    .done-header {
      background:linear-gradient(135deg, rgba(37,99,235,.95), rgba(37,99,235,.85));
      color:#fff; padding:1.25rem 1.25rem;
    }
    .done-header .subtitle { opacity:.85; font-size:.9rem; }

    .success-badge {
      width:64px; height:64px;
      border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      margin:0 auto 1rem;
      background:rgba(37,99,235,.1); color:var(--brand);
    }

    .btn-brand { background:var(--brand); border:none; }
    .btn-brand:hover { filter:brightness(.95); }

    .helper-links a { color:var(--brand); text-decoration:none; }
    .helper-links a:hover { text-decoration:underline; }
  </style>
</head>
<body>
  {% include "accounts/navbar.html" %}

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 done-wrap">
        <div class="card done-card">
          <div class="done-header">
            <h1 class="h5 fw-bold mb-1">Password Reset Complete</h1>
            <p class="subtitle mb-0">You can now sign in with your new password</p>
          </div>

          <div class="card-body p-4 p-md-5 text-center">
            <div class="success-badge">
              <i class="bi bi-check2-circle fs-2"></i>
            </div>
            <p class="text-muted mb-4">
              Your password has been set successfully.
            </p>

            <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
              <a href="{% url 'login' %}" class="btn btn-brand rounded-pill px-4 py-2 fw-semibold">
                Sign In
              </a>
            </div>
          </div>
        </div>

        <p class="text-center mt-3 small text-muted">
        </p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
