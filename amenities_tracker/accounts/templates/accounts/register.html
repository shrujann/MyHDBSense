{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Register | MyHDBSense</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'assets/style.css' %}">
</head>
<body class="bg-light">
  {% include "accounts/navbar.html" %}

  <div id="fallback-register" class="container py-5 d-none">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <h2 class="h4 mb-3 text-center">Register</h2>
        <form method="post" action="{% url 'register' %}">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit" class="btn btn-primary w-100">Register</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const modalEl = document.getElementById('authRegisterModal');
      if (modalEl && window.bootstrap) {
        new bootstrap.Modal(modalEl).show();
      } else {
        document.getElementById('fallback-register')?.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
