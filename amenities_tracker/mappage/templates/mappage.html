{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyHDBSense | Add Amenities</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    :root{
      --brand:#2563eb;
      --ink:#0f172a;
      --muted:#6b7280;
      --panel:#ffffff;
      --border:#e3e8f4;
    }

    *{box-sizing:border-box;}
    html, body{
      margin:0;
      padding:0;
      height:100%;
      font-family:"Inter", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background:#f5f6fb;
      color:var(--ink);
    }

    body.map-shell{
      display:flex;
      flex-direction:column;
      min-height:100vh;
    }

    .map-stage{
      position:relative;
      flex:1;
      min-height:0;
    }

    #map{
      width:100%;
      height:calc(100vh - 70px);
      min-height:540px;
    }

    .map-toolbar{
      position:absolute;
      top:1rem;
      left:50%;
      transform:translateX(-50%);
      width:min(960px, calc(100% - 2rem));
      background:#fff;
      border:1px solid var(--border);
      border-radius:16px;
      box-shadow:0 18px 40px rgba(15,23,42,.15);
      padding:1rem 1.2rem;
      display:flex;
      flex-wrap:wrap;
      gap:.75rem 1rem;
      align-items:center;
      z-index:1000;
    }

    .toolbar-text{
      flex:1 1 240px;
    }
    .toolbar-title{
      margin:0;
      font-size:1rem;
      font-weight:700;
      color:var(--ink);
    }
    .toolbar-copy{
      margin:0;
      font-size:.9rem;
      color:var(--muted);
    }

    .btn-cluster{
      display:flex;
      flex-wrap:wrap;
      gap:.5rem;
      justify-content:flex-start;
    }
    .pill-link{
      display:inline-flex;
      align-items:center;
      gap:.35rem;
      border-radius:999px;
      border:1px solid var(--border);
      padding:.55rem 1.1rem;
      font-weight:600;
      color:var(--ink);
      text-decoration:none;
      background:#fff;
      transition:all .15s ease;
    }
    .pill-link:hover{border-color:var(--brand); color:var(--brand);}
    .pill-link.primary{background:var(--brand);color:#fff;border-color:var(--brand);}
    .pill-link.primary:hover{filter:brightness(.95);}

    .toolbar-search{
      position:relative;
      flex:1 1 100%;
    }
    .toolbar-search input{
      width:100%;
      border:1px solid var(--border);
      border-radius:14px;
      padding:.85rem 1rem .85rem 2.8rem;
      font-size:1rem;
      outline:none;
      box-shadow:0 6px 18px rgba(15,23,42,.08);
    }
    .toolbar-search .bi-search{
      position:absolute;
      left:1rem;
      top:50%;
      transform:translateY(-50%);
      color:var(--muted);
    }

    .search-results{
      position:absolute;
      top:calc(100% + 6px);
      left:0;
      right:0;
      background:#fff;
      border:1px solid var(--border);
      border-radius:14px;
      box-shadow:0 18px 30px rgba(15,23,42,.15);
      max-height:280px;
      overflow:auto;
      z-index:10;
    }
    .search-results.hidden{display:none;}
    .search-results ul{list-style:none;margin:0;padding:0;}
    .search-results li{padding:.85rem 1rem;border-bottom:1px solid var(--border);cursor:pointer;}
    .search-results li:last-child{border-bottom:none;}
    .search-results li:hover{background:#f6f8ff;}
    .result-title{font-weight:600;font-size:.95rem;}
    .result-sub{display:block;font-size:.82rem;color:var(--muted);margin-top:2px;}

    .toolbar-hints{
      display:flex;
      flex-wrap:wrap;
      gap:1rem;
      font-size:.85rem;
      color:#475467;
    }
    .toolbar-hints span{
      display:inline-flex;
      align-items:center;
      gap:.35rem;
    }

    @media (max-width:768px){
      #map{height:calc(100vh - 110px);}
      .map-toolbar{
        width:calc(100% - 1.5rem);
        padding:.9rem 1rem;
      }
      .btn-cluster{width:100%;justify-content:flex-start;}
    }
  </style>
</head>
<body class="map-shell">
  {% include "accounts/navbar.html" %}

  <main class="map-stage">
    <div class="map-toolbar">
      <div class="toolbar-text">
        <p class="text-uppercase text-primary fw-semibold small mb-1">Community update</p>
        <p class="toolbar-title">Share a Missing Amenity</p>
        <p class="toolbar-copy">Pick a spot on the map or search for an address.</p>
      </div>
      <div class="btn-cluster">
        <a href="{% url 'amenities' %}" class="pill-link"><i class="bi bi-arrow-left"></i>Back to Explorer</a>
        <a href="{% url 'results' %}" class="pill-link primary"><i class="bi bi-chat-left-text"></i>View Requests</a>
      </div>
      <div class="toolbar-search">
        <i class="bi bi-search"></i>
        <input id="search-input" type="text" placeholder="Search any Singapore address..." autocomplete="off"/>
        <div id="search-results" class="search-results hidden">
          <ul id="search-list"></ul>
        </div>
      </div>
    </div>

    <div id="map"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Load Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Initialize the map
    const map = L.map('map').setView([1.3521, 103.8198], 12); // singapore 

    // Add OpenStreetMap tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let marker;

    // Debounce helper
    function debounce(fn, wait = 300) {
      let timeout;
      return (...args) => {
        clearTimeout(timeout);
        timeout = setTimeout(() => fn(...args), wait);
      };
    }

    // OneMap Search API (no token needed)
    async function searchOneMap(query) {
      if (!query || query.trim().length < 3) return [];
      const url = `https://www.onemap.gov.sg/api/common/elastic/search?searchVal=${encodeURIComponent(query)}&returnGeom=Y&getAddrDetails=Y&pageNum=1`;
      try {
        const resp = await fetch(url);
        if (!resp.ok) return [];
        const data = await resp.json();
        const results = data.results || [];
        // Normalize to { title, subtitle, lat, lon }
        return results.slice(0, 8).map(r => ({
          title: r.SEARCHVAL || r.BUILDING || r.ADDRESS,
          subtitle: r.ADDRESS || `${r.BLOCK || ''} ${r.ROAD_NAME || ''}`.trim(),
          lat: parseFloat(r.LATITUDE),
          lon: parseFloat(r.LONGITUDE),
        }));
      } catch (error) {
        console.error('Search error:', error);
        return [];
      }
    }

    // Search UI elements
    const inputEl = document.getElementById('search-input');
    const resultsEl = document.getElementById('search-results');
    const listEl = document.getElementById('search-list');

    let searchResults = [];

    function clearResults() {
      listEl.innerHTML = '';
      resultsEl.classList.add('hidden');
      searchResults = [];
    }

    function showResults(items) {
      if (!items.length) {
        clearResults();
        return;
      }
      searchResults = items;
      listEl.innerHTML = items.map((it, idx) => `
        <li data-idx="${idx}">
          <span class="result-title">${it.title || 'Result'}</span>
          ${it.subtitle ? `<span class="result-sub">${it.subtitle}</span>` : ''}
        </li>
      `).join('');
      resultsEl.classList.remove('hidden');
    }

    const doSearch = debounce(async () => {
      const q = inputEl.value.trim();
      if (q.length < 3) {
        clearResults();
        return;
      }
      const items = await searchOneMap(q);
      showResults(items);
    }, 300);

    inputEl.addEventListener('input', doSearch);
    inputEl.addEventListener('focus', () => {
      if (listEl.children.length) resultsEl.classList.remove('hidden');
    });

    // Click outside to close results
    document.addEventListener('click', (e) => {
      if (!resultsEl.contains(e.target) && e.target !== inputEl) {
        clearResults();
      }
    });

    // Handle result selection
    listEl.addEventListener('click', (e) => {
      const li = e.target.closest('li');
      if (!li) return;
      const idx = Number(li.getAttribute('data-idx'));
      const selected = searchResults[idx];
      if (!selected) return;

      clearResults();
      inputEl.value = selected.title;

      // Pan map and drop marker
      const lat = selected.lat;
      const lng = selected.lon;
      map.flyTo([lat, lng], 17, { duration: 0.8 });

      if (marker) {
        marker.setLatLng([lat, lng]);
      } else {
        marker = L.marker([lat, lng]).addTo(map);
      }

      marker.bindPopup(selected.title).openPopup();

      // Redirect to form with coordinates
      setTimeout(() => {
        const formUrl = `/map/form/?lat=${lat}&lng=${lng}`;
        window.location.href = formUrl;
      }, 800);
    });

    // Add a click listener to the map
    map.on('click', (event) => {
      const { lat, lng } = event.latlng;

      // Place a marker at the clicked location
      if (marker) {
        marker.setLatLng([lat, lng]);
      } else {
        marker = L.marker([lat, lng]).addTo(map);
      }

      // Redirect to the form page with the selected location
      const formUrl = `/map/form/?lat=${lat}&lng=${lng}`;
      window.location.href = formUrl;
    });
  </script>
</body>
</html>
